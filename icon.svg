<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- two overlapping photo prints stitched by a thread — the game in one glyph -->
  <g transform="rotate(-7 24 26)">
    <rect x="5" y="12" width="36" height="28" fill="#f5ede0" stroke="#1c1510" stroke-width="4.5" />
    <rect x="11" y="18" width="24" height="10" fill="#c4916c" />
  </g>
  <g transform="rotate(6 42 40)">
    <rect x="23" y="25" width="36" height="28" fill="#f0dccf" stroke="#1c1510" stroke-width="4.5" />
    <rect x="29" y="41" width="24" height="6" fill="#a8784c" />
  </g>
  <path d="M12 50 Q 32 30 54 16" fill="none" stroke="#b23b2e" stroke-width="4.5" stroke-dasharray="6 5.5" stroke-linecap="round" />
</svg>
